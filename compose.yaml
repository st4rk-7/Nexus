services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: "3001"
      CLIENT_ORIGIN: "http://localhost:8080,http://127.0.0.1:8080"
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

  # Lab PCs have no Bun/Node: `docker compose run --rm simulator`
  simulator:
    image: oven/bun:latest
    profiles: ["sim"]
    depends_on:
      - backend
    environment:
      API_URL: "http://backend:3001"
    volumes:
      - ./simulator:/sim:ro
    working_dir: /sim
    command: ["bun", "device.js"]

volumes:
  uploads_data:
