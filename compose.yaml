services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: "3001"
      CLIENT_ORIGIN: "http://localhost:8080,http://127.0.0.1:8080"
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
